<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Timer Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>⏱️ Timer Manager</h1>
                <h2 data-i18n="register-title">Criar Nova Conta</h2>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name" data-i18n="label-name">Nome</label>
                    <input type="text" id="name" name="name" required
                           placeholder="Seu nome completo" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="label-email">Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="label-password">Senha</label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••" autocomplete="new-password" minlength="6">
                    <small data-i18n="password-hint">Mínimo de 6 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="label-confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           placeholder="••••••••" autocomplete="new-password">
                </div>

                <div class="form-options">
                    <button id="langToggle" type="button" class="btn-link">🌐 EN/PT</button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>

                <button type="submit" class="btn-primary btn-full" data-i18n="btn-create-account">
                    Criar Conta
                </button>

                <div class="auth-footer">
                    <p>
                        <span data-i18n="have-account">Já tem uma conta?</span>
                        <a href="login.html" data-i18n="btn-login">Entrar</a>
                    </p>
                    <p>
                        <a href="index.html" data-i18n="back-home">← Voltar para Home</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('langToggle').addEventListener('click', () => {
            const currentLang = localStorage.getItem('language') || 'pt';
            const newLang = currentLang === 'pt' ? 'en' : 'pt';
            localStorage.setItem('language', newLang);
            location.reload();
        });

        // Initialize i18n
        window.addEventListener('DOMContentLoaded', () => {
            initI18n();
        });
    </script>
</body>
</html>
