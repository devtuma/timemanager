<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Timer Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>⏱️ Timer Manager</h1>
                <h2 data-i18n="login-title">Bem-vindo de Volta</h2>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" data-i18n="label-email">Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="label-password">Senha</label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span data-i18n="remember-me">Lembrar de mim</span>
                    </label>
                    <button id="langToggle" type="button" class="btn-link">🌐 EN/PT</button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-primary btn-full" data-i18n="btn-login">
                    Entrar
                </button>

                <div class="auth-footer">
                    <p>
                        <span data-i18n="no-account">Não tem uma conta?</span>
                        <a href="register.html" data-i18n="btn-register">Criar Conta</a>
                    </p>
                    <p>
                        <a href="index.html" data-i18n="back-home">← Voltar para Home</a>
                    </p>
                </div>
            </form>

            <div class="demo-mode">
                <hr>
                <p data-i18n="demo-mode-text">Ou continue sem login (modo local)</p>
                <button id="demoMode" class="btn-secondary btn-full" data-i18n="btn-demo">
                    Modo Demo (Sem Login)
                </button>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('langToggle').addEventListener('click', () => {
            const currentLang = localStorage.getItem('language') || 'pt';
            const newLang = currentLang === 'pt' ? 'en' : 'pt';
            localStorage.setItem('language', newLang);
            location.reload();
        });

        document.getElementById('demoMode').addEventListener('click', () => {
            localStorage.setItem('demo_mode', 'true');
            window.location.href = 'app.html';
        });

        // Initialize i18n
        window.addEventListener('DOMContentLoaded', () => {
            initI18n();
        });
    </script>
</body>
</html>
